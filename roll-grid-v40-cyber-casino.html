<style>

/* v37 premium visual layer */

 background:

<body><div id="comboCallout"></div><div id="scorePop"></div><button id="soundToggle" type="button" aria-label="Sound">🔊</button>
<div class="wrap">
<h1>ROLL GRID 4 <small style="font-size:.32em;opacity:.45">v40</small></h1><div class="sub">4×4 Dice Puzzle</div>
<div class="top">
 <div class="stat">SCORE<b id="score">0</b></div><div class="stat">BEST<b id="best">0</b></div>
 <div class="stat">PLACED<b id="turn">0</b></div><div class="stat">COMBO<b id="combo">×1.0</b></div>
</div>

 <div class="panel"><div id="board" class="board"></div></div>
 <div>
  <div class="panel"><b>YOUR DICE</b>

   <div class="sub" style="margin-top:8px">4個を好きな空きマスへ配置</div>

  </div>

<script>

// v37 lightweight WebAudio SFX — no external audio files.
let soundOn=true, audioCtx=null;
function ac(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur=.08,type="sine",gain=.045,delay=0){
  if(!soundOn)return;
  const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
function sfxPlace(){tone(230,.055,"triangle",.035);tone(330,.045,"sine",.018,.025)}
function sfxLock(){tone(170,.07,"square",.025);tone(260,.09,"triangle",.035,.045)}
function sfxScore(){tone(523,.10,"sine",.04);tone(659,.11,"sine",.04,.07);tone(784,.15,"sine",.045,.14)}
function sfxGameOver(){tone(330,.16,"triangle",.035);tone(247,.18,"triangle",.035,.14);tone(165,.28,"sine",.04,.30)}


function showScorePop(points,multi){
 const el=document.getElementById("scorePop");
 el.textContent="+"+points+(multi>1?"  ×"+multi.toFixed(1):"");
 el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
}

function comboVoice(level){
  // short casino-style fanfare; escalates with combo level
  if(!soundOn)return;
  if(level<=1){
    tone(659,.09,"triangle",.04); tone(784,.13,"sine",.04,.07);
  }else if(level===2){
    tone(659,.08,"triangle",.04); tone(784,.09,"triangle",.04,.06);
    tone(988,.15,"sine",.05,.13);
  }else{
    tone(659,.07,"triangle",.04); tone(784,.08,"triangle",.04,.05);
    tone(988,.10,"triangle",.045,.10); tone(1319,.22,"sine",.055,.17);
  }
}
function showComboCallout(level){
  const el=document.getElementById("comboCallout");
  const word=level<=1?"GOOD!":level===2?"GREAT!":"EXCELLENT!";
  const sub=level<=1?"SCORE":level+" COMBO";
  el.innerHTML=word+'<span class="sub">'+sub+'</span>';
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  comboVoice(level);
}

document.getElementById("soundToggle").addEventListener("click",()=>{
  soundOn=!soundOn;
  document.getElementById("soundToggle").textContent=soundOn?"🔊":"🔇";
  if(soundOn){ac();tone(660,.06,"sine",.025)}
});
document.addEventListener("pointerdown",()=>{if(soundOn)ac()},{once:true});


(function(){
"use strict";
const $=id=>document.getElementById(id);
const COLORS=["red","blue","yellow","green"];
let colorBag=[];
function refillColorBag(){
 colorBag=[];
 for(const c of COLORS)for(let i=0;i<4;i++)colorBag.push(c);
 for(let i=colorBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[colorBag[i],colorBag[j]]=[colorBag[j],colorBag[i]]}
}
function nextColor(){if(!colorBag.length)refillColorBag();return colorBag.pop()}
function roll(){if(Math.random()<.01)return{wild:true,n:"★",c:"wild"};return{wild:false,n:1+Math.floor(Math.random()*4),c:nextColor()}}
function newTray(){return[roll(),roll(),roll(),roll()]}

let board=new Array(16).fill(null),tray=newTray(),placedThisTurn=[],score=0,best=0,turn=0,combo=0,busy=false;

function get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
best=Number(get("rg4best","0"));

function dieEl(d){const x=document.createElement("div");x.className="die "+d.c;x.textContent=d.n;return x}
function patterns(){
 let p=[];
 for(let r=0;r<4;r++)p.push(["横 "+(r+1),[r*4,r*4+1,r*4+2,r*4+3]]);
 for(let c=0;c<4;c++)p.push(["縦 "+(c+1),[c,c+4,c+8,c+12]]);
 p.push(["斜め ↘",[0,5,10,15]],["斜め ↙",[3,6,9,12]]);
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){let i=r*4+c;p.push(["2×2",[i,i+1,i+4,i+5]])}
 p.push(["四隅",[0,3,12,15]]);return p
}
function classify(ds){
 if(ds.some(x=>!x))return[];
 const normal=ds.filter(x=>!x.wild),colors=normal.map(x=>x.c),nums=normal.map(x=>x.n);
 const uc=new Set(colors),un=new Set(nums);
 const sameColor=uc.size<=1,fourColors=uc.size===normal.length,sameNumber=un.size<=1;
 const straight=un.size===normal.length&&nums.every(n=>n>=1&&n<=4);
 if(sameColor&&sameNumber)return[["同じ色で同じ数字",100]];
 if(sameColor&&straight)return[["同じ色で連番",80]];
 if(fourColors&&sameNumber)return[["4色揃って同じ数字",50]];
 if(fourColors&&straight)return[["4色揃って連番",30]];
 return[];
}
function evaluate(){let z=[];for(const[name,idx]of patterns()){const hands=classify(idx.map(i=>board[i]));if(hands.length)z.push({name,idx,hands})}return z}
function mult(){return combo<=1?1:1+combo/10}
function log(s){$("log").insertAdjacentHTML("afterbegin","<div>"+s+"</div>")}

function render(){
 const b=$("board");b.innerHTML="";
 board.forEach((d,i)=>{
  const c=document.createElement("div");c.className="cell";c.dataset.i=i;
  if(d){
   const el=dieEl(d);c.appendChild(el);
   if(placedThisTurn.includes(i) && d.turnTray!==undefined) installBoardDrag(el,i);
  }
  b.appendChild(c)
 });
 $("score").textContent=score.toLocaleString();$("best").textContent=best.toLocaleString();$("turn").textContent=turn;$("combo").textContent="×"+mult().toFixed(1);

 const t=$("tray");t.innerHTML="";
 tray.forEach((d,i)=>{
  const slot=document.createElement("div");slot.className="nextslot"+(d?"":" used");
  if(d){const el=dieEl(d);slot.appendChild(el);installDrag(el,i)}
  t.appendChild(slot);
 });
 $("lock").disabled=busy||placedThisTurn.length===0;
}

function installDrag(source,trayIndex){
 let ghost=null,active=false,w=0,h=0;
 function point(x,y){
  if(!ghost)return;
  ghost.style.left=(x-w/2)+"px";ghost.style.top=(y-h/2)+"px";
  document.querySelectorAll(".target").forEach(e=>e.classList.remove("target"));
  const hit=document.elementFromPoint(x,y),cell=hit&&hit.closest?hit.closest(".cell"):null;
  if(cell&&!board[Number(cell.dataset.i)])cell.classList.add("target");
 }
 function begin(x,y){
  if(busy||active||!tray[trayIndex])return;active=true;
  const r=source.getBoundingClientRect();w=r.width;h=r.height;
  ghost=source.cloneNode(true);ghost.classList.add("dragGhost");ghost.style.width=w+"px";ghost.style.height=h+"px";document.body.appendChild(ghost);
  source.style.visibility="hidden";point(x,y);
 }
 function finish(x,y){
  if(!active)return;active=false;
  if(ghost){ghost.remove();ghost=null}
  document.querySelectorAll(".target").forEach(e=>e.classList.remove("target"));
  const hit=document.elementFromPoint(x,y),cell=hit&&hit.closest?hit.closest(".cell"):null;
  source.style.visibility="";
  if(cell&&!board[Number(cell.dataset.i)]){
   const target=Number(cell.dataset.i),d=tray[trayIndex];
   board[target]={...d,turnTray:trayIndex};tray[trayIndex]=null;placedThisTurn.push(target);turn++;sfxPlace();render();
  }
 }
 source.ontouchstart=e=>{if(e.touches.length!==1)return;e.preventDefault();const t=e.touches[0];begin(t.clientX,t.clientY)};
 source.ontouchmove=e=>{if(!active)return;e.preventDefault();const t=e.touches[0];point(t.clientX,t.clientY)};
 source.ontouchend=e=>{if(!active)return;e.preventDefault();const t=e.changedTouches[0];finish(t.clientX,t.clientY)};
 source.ontouchcancel=()=>{if(active){active=false;if(ghost)ghost.remove();source.style.visibility=""}};
 source.onmousedown=e=>{e.preventDefault();begin(e.clientX,e.clientY);document.onmousemove=m=>point(m.clientX,m.clientY);document.onmouseup=m=>{document.onmousemove=null;document.onmouseup=null;finish(m.clientX,m.clientY)}};
}


function installBoardDrag(source,fromIndex){
 let ghost=null,active=false,w=0,h=0;
 function point(x,y){
  if(!ghost)return;
  ghost.style.left=(x-w/2)+"px";ghost.style.top=(y-h/2)+"px";
  document.querySelectorAll(".target").forEach(e=>e.classList.remove("target"));
  const hit=document.elementFromPoint(x,y),cell=hit&&hit.closest?hit.closest(".cell"):null;
  if(cell && (Number(cell.dataset.i)===fromIndex || !board[Number(cell.dataset.i)])) cell.classList.add("target");
 }
 function begin(x,y){
  if(busy||active)return;active=true;
  const r=source.getBoundingClientRect();w=r.width;h=r.height;
  ghost=source.cloneNode(true);ghost.classList.add("dragGhost");ghost.style.width=w+"px";ghost.style.height=h+"px";document.body.appendChild(ghost);
  source.style.visibility="hidden";point(x,y);
 }
 function finish(x,y){
  if(!active)return;active=false;
  if(ghost){ghost.remove();ghost=null}
  document.querySelectorAll(".target").forEach(e=>e.classList.remove("target"));
  const hit=document.elementFromPoint(x,y),cell=hit&&hit.closest?hit.closest(".cell"):null;
  source.style.visibility="";
  const d=board[fromIndex];
  if(!d)return;
  if(cell){
   const to=Number(cell.dataset.i);
   if(to!==fromIndex && !board[to]){
    board[to]=d;board[fromIndex]=null;
    placedThisTurn=placedThisTurn.map(v=>v===fromIndex?to:v);
    render();return;
   }
  }
  // Dropping outside the board returns this die to its original tray slot.
  board[fromIndex]=null;
  tray[d.turnTray]={wild:d.wild,n:d.n,c:d.c};
  placedThisTurn=placedThisTurn.filter(v=>v!==fromIndex);
  turn=Math.max(0,turn-1);
  render();
 }
 source.ontouchstart=e=>{if(e.touches.length!==1)return;e.preventDefault();const t=e.touches[0];begin(t.clientX,t.clientY)};
 source.ontouchmove=e=>{if(!active)return;e.preventDefault();const t=e.touches[0];point(t.clientX,t.clientY)};
 source.ontouchend=e=>{if(!active)return;e.preventDefault();const t=e.changedTouches[0];finish(t.clientX,t.clientY)};
 source.ontouchcancel=()=>{if(active){active=false;if(ghost)ghost.remove();source.style.visibility="";render()}};
 source.onmousedown=e=>{e.preventDefault();begin(e.clientX,e.clientY);document.onmousemove=m=>point(m.clientX,m.clientY);document.onmouseup=m=>{document.onmousemove=null;document.onmouseup=null;finish(m.clientX,m.clientY)}};
}

async function lockAndScore(){
 if(busy||placedThisTurn.length===0)return;
 busy=true;$("lock").disabled=true;sfxLock();
 placedThisTurn.forEach(i=>{if(board[i])delete board[i].turnTray});
 const wins=evaluate();
 if(wins.length){
  combo++;
  showComboCallout(combo);const m=mult(),clear=new Set(),steps=[];
  wins.forEach(w=>w.hands.forEach(h=>steps.push({name:w.name,idx:w.idx,hand:h[0],base:h[1]})));
  for(const s of steps){
   document.querySelectorAll(".flash").forEach(x=>x.classList.remove("flash"));
   s.idx.forEach(j=>$("board").children[j].classList.add("flash"));
   await new Promise(r=>setTimeout(r,300));
   const gain=Math.round(s.base*m);showScorePop(gain,m);score+=gain;if(score>best){best=score;set("rg4best",best)}
   $("score").textContent=score.toLocaleString();$("best").textContent=best.toLocaleString();
   log("+"+gain+" "+s.name+" / "+s.hand+" ×"+m.toFixed(1));s.idx.forEach(j=>clear.add(j));
   document.querySelectorAll(".flash").forEach(x=>x.classList.remove("flash"));
   await new Promise(r=>setTimeout(r,150));
  }
  [...clear].forEach(j=>$("board").children[j].classList.add("clearing"));
  await new Promise(r=>setTimeout(r,240));
  [...clear].forEach(j=>board[j]=null);
 }else combo=0;

 placedThisTurn=[];

 // LOCK後の役判定・消去が終わった時点で16マス全部埋まっていたらGAME OVER。
 // 役が成立して消え、空きマスができた場合は続行。
 const empty=board.filter(x=>!x).length;
 if(empty===0){gameOver();return}

 // 未使用ダイスは保持。4個すべて使い切った時だけ次の4個を補充。
 if(tray.every(d=>d===null)) tray=newTray();

 busy=false;render();
}

function gameOver(){
 sfxGameOver();
 let scores=[];try{scores=JSON.parse(get("rg4scores","[]"))}catch(e){}
 scores.push({score,date:new Date().toLocaleDateString("ja-JP")});scores.sort((a,b)=>b.score-a.score);scores=scores.slice(0,10);set("rg4scores",JSON.stringify(scores));
 $("finalScore").textContent=score.toLocaleString();$("scoreList").innerHTML=scores.map(x=>"<li><b>"+x.score.toLocaleString()+"</b>　"+x.date+"</li>").join("");$("gameOver").classList.add("show")
}
function reset(){
 board=new Array(16).fill(null);colorBag=[];tray=newTray();placedThisTurn=[];score=0;turn=0;combo=0;busy=false;
 $("gameOver").classList.remove("show");$("log").innerHTML="";render()
}
$("lock").onclick=lockAndScore;$("reset").onclick=reset;$("again").onclick=reset;render();
})();
</script>
